<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0f0f10"/>
      <stop offset="1" stop-color="#1a0a20"/>
    </linearGradient>
    <linearGradient id="a" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ec4899"/>
      <stop offset=".5" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ec4899" stop-opacity="0.9"/>
      <stop offset=".33" stop-color="#e11d48" stop-opacity="0.9"/>
      <stop offset=".66" stop-color="#0ea5e9" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="200" fill="none" stroke="url(#ring)" stroke-width="6" opacity="0.55"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="url(#ring)" stroke-width="3" opacity="0.35"/>
  <text x="50%" y="50%" font-family="-apple-system, sans-serif" font-size="200" font-weight="900" text-anchor="middle" dominant-baseline="central" fill="url(#a)" filter="url(#glow)" letter-spacing="-8">AI</text>
  <circle cx="380" cy="150" r="10" fill="#ec4899"/>
  <circle cx="130" cy="380" r="10" fill="#0ea5e9"/>
  <circle cx="380" cy="380" r="10" fill="#a855f7"/>
  <circle cx="130" cy="150" r="10" fill="#e11d48"/>
</svg>
